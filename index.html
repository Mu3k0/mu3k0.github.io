<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d7a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账小助手">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>记账小助手 · AA 旅行平账</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f1ea;
    --card: #ffffff;
    --primary: #2d7a5f;
    --primary-light: #e8f3ee;
    --primary-soft: #f4faf7;
    --accent: #d4a574;
    --danger: #c84a4a;
    --text: #2c2c2c;
    --text-light: #6b6b6b;
    --border: #e5dfd3;
    --shadow: 0 2px 12px rgba(45, 122, 95, 0.06);
    --radius: 14px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container { max-width: 920px; margin: 0 auto; padding: 24px 20px 80px; }

  header {
    background: linear-gradient(135deg, var(--primary) 0%, #3d9a7a 100%);
    color: white;
    padding: 32px 26px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  header h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 4px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  header p  { opacity: 0.88; font-size: 14px; }
  .header-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.18);
    color: white;
    backdrop-filter: blur(4px);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.32); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--primary-light); border-color: var(--primary); }

  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #a83a3a; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #256452; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  .card h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card h2::before {
    content: '';
    width: 4px;
    height: 16px;
    background: var(--primary);
    border-radius: 2px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field.full-width { grid-column: 1 / -1; }
  .form-field label { font-size: 13px; color: var(--text-light); font-weight: 500; }
  .form-field label .required { color: var(--danger); margin-left: 2px; }

  .form-field input,
  .form-field select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.18s;
    background: white;
    color: var(--text);
  }
  .form-field input:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(45, 122, 95, 0.12);
  }

  .chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 44px;
    background: white;
    align-items: center;
  }
  .chips-container:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(45, 122, 95, 0.12);
  }
  .chip {
    background: var(--primary-light);
    color: var(--primary);
    padding: 4px 6px 4px 10px;
    border-radius: 14px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip .remove {
    cursor: pointer;
    font-weight: 700;
    opacity: 0.55;
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.15s;
  }
  .chip .remove:hover { opacity: 1; background: rgba(45, 122, 95, 0.15); }
  .chips-container input {
    border: none; outline: none; flex: 1; min-width: 80px;
    padding: 4px; font-size: 14px; font-family: inherit; background: transparent;
  }

  .form-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

  .entries-summary {
    display: flex; gap: 18px; margin-bottom: 14px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--primary-soft);
    border-radius: 8px; font-size: 14px;
  }
  .entries-summary strong { color: var(--primary); font-weight: 600; }

  .entry-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: all 0.18s;
    background: white;
  }
  .entry-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(45, 122, 95, 0.08); }
  .entry-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 12px;
  }
  .entry-amount {
    font-size: 22px; font-weight: 600;
    color: var(--primary); margin-bottom: 4px;
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .entry-amount .ccy {
    font-size: 12px; color: var(--text-light);
    background: var(--primary-soft);
    padding: 2px 7px; border-radius: 4px; font-weight: 500;
  }
  .entry-meta {
    font-size: 13px; color: var(--text-light);
    display: flex; flex-wrap: wrap; gap: 14px;
  }
  .entry-meta span {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .entry-participants {
    margin-top: 8px; font-size: 13px; color: var(--text-light);
    display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .entry-participants .names {
    display: inline-flex; flex-wrap: wrap; gap: 4px;
  }
  .entry-participants .name-tag {
    background: var(--primary-light); color: var(--primary);
    padding: 2px 9px; border-radius: 10px; font-size: 12px;
  }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty-state {
    text-align: center; padding: 36px 20px;
    color: var(--text-light); font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  .currency-block {
    margin-bottom: 18px;
  }
  .currency-block:last-child { margin-bottom: 0; }
  .currency-block-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px;
    color: var(--primary);
    background: var(--primary-light);
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .settlement-list { display: flex; flex-direction: column; gap: 8px; }
  .settlement-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 16px; background: var(--primary-soft);
    border-radius: 8px; font-size: 14px;
  }
  .settlement-row.settled { background: #f0f0f0; color: var(--text-light); }
  .settlement-amount { font-weight: 600; color: var(--primary); }
  .settlement-amount.negative { color: var(--danger); }

  .transfer-list { display: flex; flex-direction: column; gap: 8px; }
  .transfer-item {
    padding: 11px 16px;
    background: linear-gradient(90deg, var(--primary-light) 0%, white 100%);
    border-left: 3px solid var(--primary);
    border-radius: 6px; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .transfer-item .arrow { color: var(--primary); font-weight: 700; }
  .transfer-item .amount { margin-left: auto; font-weight: 600; color: var(--primary); }

  .section-subtitle {
    margin-top: 14px; margin-bottom: 10px;
    font-size: 13px; color: var(--text-light); font-weight: 500;
  }

  .history-list { max-height: 480px; overflow-y: auto; }
  .history-item {
    padding: 11px 0; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .history-item:last-child { border-bottom: none; }
  .history-dot {
    width: 9px; height: 9px; border-radius: 50%;
    margin-top: 7px; flex-shrink: 0;
  }
  .history-dot.create { background: var(--primary); }
  .history-dot.update { background: var(--accent); }
  .history-dot.delete { background: var(--danger); }
  .history-content { flex: 1; font-size: 13px; }
  .history-content .action {
    font-weight: 500; margin-bottom: 2px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .history-content .details { color: var(--text-light); font-size: 12px; }
  .history-content .time { color: var(--text-light); font-size: 11px; margin-top: 4px; }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(45, 122, 95, 0.95);
    color: white;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .icon {
    display: inline-block;
    width: 1.1em;
    height: 1.1em;
    vertical-align: -0.2em;
    flex-shrink: 0;
  }
  .btn .icon { width: 1em; height: 1em; }
  .entry-actions .btn .icon { width: 0.95em; height: 0.95em; }
  .empty-state .icon { width: 40px; height: 40px; opacity: 0.4; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    header { padding: 24px 18px; }
    .card { padding: 18px; }
    .container { padding: 14px 12px 60px; }
    .entry-header { flex-direction: column; }
    .entry-actions { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.2em;height:1.2em;">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c1.4 9.3 1.4 13.04-3 17.04-2.5 2.26-7.5 2.5-9 .94"/>
        <path d="M2 21c0-3 1.85-5.36 5.08-6"/>
      </svg>
      记账小助手
    </h1>
    <p>旅行后与朋友轻松平账 · 数据保存在本地浏览器</p>
    <div class="header-actions">
      <button class="btn" id="exportJsonBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        导出 JSON
      </button>
      <button class="btn" id="importJsonBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导入 JSON
      </button>
      <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">
      <button class="btn" id="exportCsvBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        导出 CSV
      </button>
      <button class="btn" id="exportImgBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        导出明细图片
      </button>
      <button class="btn" id="clearBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清空全部
      </button>
    </div>
  </header>

  <section class="card">
    <h2 id="formTitle">添加一笔账目</h2>
    <form id="entryForm" autocomplete="off">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-field">
          <label>日期 <span class="required">*</span></label>
          <input type="date" id="date" required>
        </div>
        <div class="form-field">
          <label>金额 <span class="required">*</span></label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
        </div>
        <div class="form-field">
          <label>币种 <span class="required">*</span></label>
          <select id="currency" required>
            <option value="CNY">人民币 ¥ (CNY)</option>
            <option value="USD">美元 $ (USD)</option>
            <option value="EUR">欧元 € (EUR)</option>
            <option value="JPY">日元 JP¥ (JPY)</option>
            <option value="GBP">英镑 £ (GBP)</option>
            <option value="HKD">港币 HK$ (HKD)</option>
            <option value="KRW">韩元 ₩ (KRW)</option>
            <option value="THB">泰铢 ฿ (THB)</option>
            <option value="SGD">新加坡元 S$ (SGD)</option>
            <option value="AUD">澳元 A$ (AUD)</option>
          </select>
        </div>
        <div class="form-field">
          <label>付款方式 <span class="required">*</span></label>
          <select id="paymentMethod" required>
            <option value="">请选择</option>
            <option value="微信">微信</option>
            <option value="支付宝">支付宝</option>
            <option value="现金">现金</option>
            <option value="银行卡">银行卡</option>
            <option value="信用卡">信用卡</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-field">
          <label>付款人 <span class="required">*</span> (限 1 人)</label>
          <input type="text" id="payer" placeholder="如：张三" list="peopleList" required>
        </div>
        <div class="form-field full-width">
          <label>消费参与人 <span class="required">*</span> <small style="color:var(--text-light);">(输入完姓名后按回车或输入逗号添加，全角半角逗号都行，可输入多人)</small></label>
          <div class="chips-container" id="participantsChips">
            <input type="text" id="participantInput" placeholder="输入姓名后回车">
          </div>
        </div>
        <div class="form-field full-width">
          <label>备注</label>
          <input type="text" id="note" placeholder="这笔钱花在哪了？（可选）">
        </div>
      </div>
      <datalist id="peopleList"></datalist>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none">取消</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">添加账目</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>账目明细</h2>
    <div class="entries-summary" id="entriesSummary"></div>
    <div id="entriesList"></div>
  </section>

  <section class="card">
    <h2>平账结算</h2>
    <div id="settlement"></div>
  </section>

  <section class="card">
    <h2>编辑历史 <span id="historyCount" style="font-size:12px;font-weight:normal;color:var(--text-light);"></span></h2>
    <div class="history-list" id="historyList"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
// 注册 Service Worker（页面加载完成后）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW 注册失败：', err));
  });
}
</script>

<script>
// ===== 单色 SVG 图标 =====
const ICONS = {
  calendar:  '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  card:      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
  user:      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  note:      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  edit:      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  sparkle:   '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>',
  sprout:    '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12c-3 0-5-2-5-5 3 0 5 2 5 5z"/><path d="M12 12c3 0 5-2 5-5-3 0-5 2-5 5z"/><path d="M5 22h14"/></svg>'
};
const ico = name => ICONS[name] || '';

// ===== 币种 =====
const CURRENCY_SYMBOL = {
  CNY: '¥', USD: '$', EUR: '€', JPY: 'JP¥', GBP: '£',
  HKD: 'HK$', KRW: '₩', THB: '฿', SGD: 'S$', AUD: 'A$'
};
function currencySymbol(code) { return CURRENCY_SYMBOL[code] || (code + ' '); }
function formatMoney(code, amount) {
  return currencySymbol(code) + Number(amount).toFixed(2);
}
function currencyLabel(code) {
  return code ? `${code} · ${currencySymbol(code)}` : '未指定';
}

// ===== 数据层 =====
const STORAGE_KEY = 'aa-bill-data-v1';
const LAST_OPTIONS_KEY = 'aa-bill-last-options-v1';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 记忆用户上次选过的币种/付款方式，下次填写时作为默认值
function loadLastOptions() {
  try {
    const raw = localStorage.getItem(LAST_OPTIONS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveLastOptions(opts) {
  try {
    localStorage.setItem(LAST_OPTIONS_KEY, JSON.stringify(opts));
  } catch (e) {}
}

function applyLastOptions() {
  const last = loadLastOptions();
  if (!last) return;
  if (last.currency) {
    const sel = document.getElementById('currency');
    if ([...sel.options].some(o => o.value === last.currency)) sel.value = last.currency;
  }
  if (last.paymentMethod) {
    const sel = document.getElementById('paymentMethod');
    if ([...sel.options].some(o => o.value === last.paymentMethod)) sel.value = last.paymentMethod;
  }
}

let state = { entries: [], history: [] };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 数据迁移：旧数据没有 currency 字段时默认 CNY
      state.entries = (Array.isArray(parsed.entries) ? parsed.entries : []).map(e => ({
        ...e,
        currency: e.currency || 'CNY'
      }));
      state.history = Array.isArray(parsed.history) ? parsed.history : [];
    }
  } catch (e) {
    console.error('加载数据失败', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

function addHistory(entryId, action, snapshot, previousData) {
  state.history.unshift({
    id: uid(), entryId, action, timestamp: Date.now(),
    snapshot: snapshot || null, previousData: previousData || null
  });
  if (state.history.length > 500) state.history = state.history.slice(0, 500);
}

function createEntry(data) {
  const entry = {
    id: uid(),
    date: data.date,
    amount: parseFloat(data.amount),
    currency: data.currency,
    paymentMethod: data.paymentMethod,
    payer: data.payer.trim(),
    participants: data.participants.map(p => p.trim()).filter(Boolean),
    note: (data.note || '').trim(),
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  state.entries.push(entry);
  addHistory(entry.id, 'create', entry);
  saveState();
  return entry;
}

function updateEntry(id, data) {
  const idx = state.entries.findIndex(e => e.id === id);
  if (idx === -1) return null;
  const previous = { ...state.entries[idx] };
  const updated = {
    ...previous,
    date: data.date,
    amount: parseFloat(data.amount),
    currency: data.currency,
    paymentMethod: data.paymentMethod,
    payer: data.payer.trim(),
    participants: data.participants.map(p => p.trim()).filter(Boolean),
    note: (data.note || '').trim(),
    updatedAt: Date.now()
  };
  state.entries[idx] = updated;
  addHistory(id, 'update', updated, previous);
  saveState();
  return updated;
}

function deleteEntry(id) {
  const idx = state.entries.findIndex(e => e.id === id);
  if (idx === -1) return;
  const removed = state.entries[idx];
  state.entries.splice(idx, 1);
  addHistory(id, 'delete', null, removed);
  saveState();
}

// 按币种分组计算每个人的净额
function computeBalanceByCurrency() {
  const result = {};
  state.entries.forEach(e => {
    const cur = e.currency || 'CNY';
    if (!result[cur]) result[cur] = {};
    result[cur][e.payer] = (result[cur][e.payer] || 0) + e.amount;
    const share = e.amount / e.participants.length;
    e.participants.forEach(p => {
      result[cur][p] = (result[cur][p] || 0) - share;
    });
  });
  return result;
}

function computeTransfers(balance) {
  const creditors = [], debtors = [];
  Object.keys(balance).forEach(name => {
    const bal = balance[name];
    if (bal > 0.005) creditors.push({ name, amount: bal });
    else if (bal < -0.005) debtors.push({ name, amount: -bal });
  });
  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const amount = Math.min(d.amount, c.amount);
    transfers.push({ from: d.name, to: c.name, amount });
    d.amount -= amount; c.amount -= amount;
    if (d.amount < 0.005) i++;
    if (c.amount < 0.005) j++;
  }
  return transfers;
}

// ===== 工具 =====
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderSettlement() {
  const container = document.getElementById('settlement');

  if (state.entries.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        ${ico('sprout')}
        <div>添加账目后这里会自动按币种分组计算平账</div>
      </div>`;
    return;
  }

  const balances = computeBalanceByCurrency();
  const currencies = Object.keys(balances).sort();

  let html = '';
  currencies.forEach(cur => {
    const balance = balances[cur];
    const names = Object.keys(balance).sort((a, b) => balance[b] - balance[a]);

    html += `<div class="currency-block">`;
    html += `<div class="currency-block-title">${escapeHtml(currencyLabel(cur))}</div>`;
    html += '<div class="settlement-list">';
    names.forEach(name => {
      const bal = balance[name];
      const settled = Math.abs(bal) < 0.005;
      const cls = settled ? 'settled' : '';
      const sign = bal > 0 ? '+' : '';
      const amtCls = bal < 0 ? 'negative' : '';
      html += `
        <div class="settlement-row ${cls}">
          <span class="settlement-name">${escapeHtml(name)}${settled ? ' ✓' : ''}</span>
          <span class="settlement-amount ${amtCls}">${sign}${formatMoney(cur, bal)}</span>
        </div>
      `;
    });
    html += '</div>';

    const transfers = computeTransfers(balance);
    if (transfers.length > 0) {
      html += '<div class="section-subtitle">最少转账方案</div>';
      html += '<div class="transfer-list">';
      transfers.forEach(t => {
        html += `
          <div class="transfer-item">
            <strong>${escapeHtml(t.from)}</strong>
            <span class="arrow">→</span>
            <strong>${escapeHtml(t.to)}</strong>
            <span class="amount">${formatMoney(cur, t.amount)}</span>
          </div>
        `;
      });
      html += '</div>';
    } else {
      html += '<p style="margin-top:10px;color:var(--text-light);font-size:13px;">已经结清，无需转账</p>';
    }

    html += `</div>`;
  });

  container.innerHTML = html;
}

const form = document.getElementById('entryForm');
const participantInput = document.getElementById('participantInput');
const chipsContainer = document.getElementById('participantsChips');

participantInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    commitParticipant();
  } else if (e.key === 'Backspace' && !participantInput.value && formParticipants.length > 0) {
    formParticipants.pop();
    renderChips();
  }
});

// 多事件协同 + 同步处理，彻底解决中文 IME 下全角逗号问题

// 1. keydown：物理按键阶段拦截，最早最稳（PC 上中文 IME 按 , 键时 e.key 就是 ','，preventDefault 能阻止 IME 后续处理）
participantInput.addEventListener('keydown', (e) => {
  if (e.key === ',' || e.key === '，') {
    e.preventDefault();
    processNow();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    processNow();
    return;
  }
  if (e.key === 'Backspace' && !participantInput.value && formParticipants.length > 0) {
    formParticipants.pop();
    renderChips();
  }
});

// 2. beforeinput：IME 提交字符前补充处理
participantInput.addEventListener('beforeinput', (e) => {
  if (e.data && /[,,]/.test(e.data)) {
    e.preventDefault();
    processNow();
  }
});

// 3. 兜底：setInterval 轮询
let lastPolledValue = participantInput.value;
setInterval(() => {
  const current = participantInput.value;
  if (current !== lastPolledValue) {
    lastPolledValue = current;
    if (/[,,]/.test(current)) processNow();
  }
}, 200);

// 同步处理（keydown 阶段 IME 被阻止，不需要 setTimeout）
function processNow() {
  const val = participantInput.value.trim();
  if (!val) {
    participantInput.value = '';
    return;
  }
  const names = val.split(/[,,]/).map(s => s.trim()).filter(Boolean);
  let changed = false;
  names.forEach(name => {
    if (!formParticipants.includes(name)) {
      formParticipants.push(name);
      changed = true;
    }
  });
  if (changed) renderChips();
  participantInput.value = '';
}

chipsContainer.addEventListener('click', (e) => {
  if (e.target.classList.contains('remove')) {
    const idx = parseInt(e.target.dataset.idx, 10);
    formParticipants.splice(idx, 1);
    renderChips();
  }
});

function renderChips() {
  chipsContainer.querySelectorAll('.chip').forEach(c => c.remove());
  formParticipants.forEach((p, idx) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${escapeHtml(p)}<span class="remove" data-idx="${idx}">×</span>`;
    chipsContainer.insertBefore(chip, participantInput);
  });
}

document.getElementById('date').valueAsDate = new Date();
applyLastOptions();
applyLastOptions();

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const editId = document.getElementById('editId').value;

  const lastInputName = participantInput.value.trim();
  if (lastInputName && !formParticipants.includes(lastInputName)) {
    formParticipants.push(lastInputName);
    renderChips();
    participantInput.value = '';
  }

  const data = {
    date: document.getElementById('date').value,
    amount: document.getElementById('amount').value,
    currency: document.getElementById('currency').value,
    paymentMethod: document.getElementById('paymentMethod').value,
    payer: document.getElementById('payer').value,
    participants: [...formParticipants],
    note: document.getElementById('note').value
  };

  if (!data.date || !data.amount || parseFloat(data.amount) <= 0 ||
      !data.currency || !data.paymentMethod || !data.payer.trim() || data.participants.length === 0) {
    alert('请填写所有必填项，并至少添加一位参与人');
    return;
  }

  if (editId) updateEntry(editId, data);
  else createEntry(data);

  // 记忆本次选择：下次填写时默认带上
  saveLastOptions({
    currency: data.currency,
    paymentMethod: data.paymentMethod
  });

  resetForm();
  render();
});

function resetForm() {
  form.reset();
  document.getElementById('editId').value = '';
  document.getElementById('date').valueAsDate = new Date();
  applyLastOptions();           // 恢复上次选择的币种 / 付款方式
  formParticipants = [];
  renderChips();
  document.getElementById('formTitle').textContent = '添加一笔账目';
  document.getElementById('submitBtn').textContent = '添加账目';
  document.getElementById('cancelEditBtn').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startEdit(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;

  document.getElementById('editId').value = entry.id;
  document.getElementById('date').value = entry.date;
  document.getElementById('amount').value = entry.amount;
  document.getElementById('currency').value = entry.currency || 'CNY';
  document.getElementById('paymentMethod').value = entry.paymentMethod;
  document.getElementById('payer').value = entry.payer;
  document.getElementById('note').value = entry.note || '';
  formParticipants = [...entry.participants];
  renderChips();

  document.getElementById('formTitle').textContent = '编辑账目';
  document.getElementById('submitBtn').textContent = '保存修改';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function handleDelete(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  if (confirm(`确定删除这条账目吗？\n${entry.date} ${formatMoney(entry.currency, entry.amount)} ${entry.payer} 付`)) {
    deleteEntry(id);
    render();
  }
}

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const incoming = JSON.parse(ev.target.result);
      if (!incoming.entries || !Array.isArray(incoming.entries)) {
        alert('JSON 格式不正确，缺少 entries 数组');
        return;
      }
      // 兼容旧数据：导入时也补齐 currency
      const entries = incoming.entries.map(e => ({ ...e, currency: e.currency || 'CNY' }));
      const history = Array.isArray(incoming.history) ? incoming.history : [];
      if (!confirm(`将覆盖当前数据，加载 ${entries.length} 笔账目和 ${history.length} 条历史。\n确定要继续吗？建议先导出当前数据备份。`)) {
        return;
      }
      state = { entries, history };
      saveState();
      render();
      showToast(`已覆盖导入 ${entries.length} 笔账目`);
    } catch (err) {
      alert('JSON 解析失败：' + err.message);
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
});

document.getElementById('exportCsvBtn').addEventListener('click', () => {
  if (state.entries.length === 0) {
    alert('当前没有账目，无法导出 CSV');
    return;
  }
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[,"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const fmt = n => Number(n).toFixed(2);
  const lines = [];

  // 块 1：账目明细（按参与人展开，第一列为参与人）
  lines.push('账目明细（按参与人展开）');
  lines.push(['参与人', '日期', '币种', '总金额', '人均', '付款人', '付款方式', '备注'].map(esc).join(','));
  const sorted = [...state.entries].sort((a, b) =>
    new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt
  );
  sorted.forEach(e => {
    const perPerson = fmt(e.amount / e.participants.length);
    e.participants.forEach(p => {
      lines.push([
        p, e.date, e.currency, fmt(e.amount), perPerson,
        e.payer, e.paymentMethod, e.note || ''
      ].map(esc).join(','));
    });
  });

  // 块 2：平账结算
  lines.push('');
  lines.push('平账结算');
  lines.push(['参与人', '币种', '净额'].map(esc).join(','));
  const balances = computeBalanceByCurrency();
  Object.keys(balances).sort().forEach(cur => {
    Object.keys(balances[cur]).sort().forEach(name => {
      lines.push([name, cur, fmt(balances[cur][name])].map(esc).join(','));
    });
  });

  // 块 3：最少转账方案
  lines.push('');
  lines.push('最少转账方案');
  lines.push(['付款人', '收款人', '币种', '金额'].map(esc).join(','));
  Object.keys(balances).sort().forEach(cur => {
    computeTransfers(balances[cur]).forEach(t => {
      lines.push([t.from, t.to, cur, fmt(t.amount)].map(esc).join(','));
    });
  });

  const BOM = '\uFEFF';
  const csv = BOM + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aa-bill-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 已导出');
});

function exportToImage() {
  const C = {
    bg: '#f5f1ea',
    card: '#ffffff',
    primary: '#2d7a5f',
    primaryDeep: '#256452',
    primaryLight: '#e8f3ee',
    accent: '#d4a574',
    danger: '#c84a4a',
    text: '#2c2c2c',
    textLight: '#6b6b6b',
    border: '#e5dfd3',
    borderSoft: '#efe9da'
  };

  const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = 760;
  const padding = 28;
  const innerW = W - padding * 2;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const sorted = [...state.entries].sort((a, b) =>
    new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt
  );
  const balancesByCcy = computeBalanceByCurrency();
  const currencies = Object.keys(balancesByCcy).sort();

  function measureHeight() {
    let h = padding;
    h += 96;       // banner
    h += 20;
    h += 70;       // 概览
    h += 16;
    h += 40;       // 明细标题
    sorted.forEach(e => {
      h += 26;     // 金额行
      h += 22;     // meta
      h += 24;     // 参与人
      if (e.note) h += 20;
      h += 12;
    });
    h += 16;
    h += 40;       // 平账标题
    currencies.forEach(cur => {
      const balance = balancesByCcy[cur];
      const names = Object.keys(balance);
      h += 30;                                    // 币种小标签
      h += names.length * 38;
      const transfers = computeTransfers(balance);
      if (transfers.length > 0) {
        h += 26;
        h += transfers.length * 36;
      } else {
        h += 28;
      }
      h += 16;
    });
    h += 30;
    h += 40;       // 签名
    h += padding;
    return h;
  }

  const totalH = measureHeight();

  canvas.width = W * dpr;
  canvas.height = totalH * dpr;
  ctx.scale(dpr, dpr);
  ctx.textBaseline = 'top';

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, totalH);

  roundRect(ctx, padding, padding, innerW, totalH - padding * 2, 14);
  ctx.fillStyle = C.card;
  ctx.fill();
  ctx.strokeStyle = C.border;
  ctx.lineWidth = 1;
  ctx.stroke();

  let y = padding;

  // banner
  const bannerH = 96;
  ctx.save();
  roundRect(ctx, padding, y, innerW, bannerH, 14);
  ctx.clip();
  const grad = ctx.createLinearGradient(padding, y, padding + innerW, y + bannerH);
  grad.addColorStop(0, C.primary);
  grad.addColorStop(1, '#3d9a7a');
  ctx.fillStyle = grad;
  ctx.fillRect(padding, y, innerW, bannerH);
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = `600 24px ${FONT}`;
  ctx.fillText('记账小助手 · 账目明细', padding + 24, y + 22);

  ctx.font = `13px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(`生成于 ${formatTime(Date.now())}`, padding + 24, y + 58);

  y += bannerH + 20;

  // 概览（按币种分别显示总金额）
  const totalByCcy = {};
  const peopleSet = new Set();
  sorted.forEach(e => {
    totalByCcy[e.currency] = (totalByCcy[e.currency] || 0) + e.amount;
    peopleSet.add(e.payer);
    e.participants.forEach(p => peopleSet.add(p));
  });

  const summaryH = 70;
  roundRect(ctx, padding + 16, y, innerW - 32, summaryH, 10);
  ctx.fillStyle = '#f4faf7';
  ctx.fill();

  ctx.fillStyle = C.textLight;
  ctx.font = `13px ${FONT}`;
  const sx = padding + 32;

  // 第一列：笔数 + 人数
  ctx.fillText('共', sx, y + 16);
  ctx.fillStyle = C.text;
  ctx.font = `600 18px ${FONT}`;
  ctx.fillText(`${sorted.length} 笔`, sx, y + 36);
  ctx.font = `13px ${FONT}`;

  // 第二列：总金额（多币种时换行）
  ctx.fillStyle = C.textLight;
  ctx.font = `13px ${FONT}`;
  ctx.fillText('总金额', sx + 110, y + 16);
  ctx.fillStyle = C.primary;
  ctx.font = `600 16px ${FONT}`;
  const totalParts = Object.keys(totalByCcy).sort().map(c => formatMoney(c, totalByCcy[c])).join(' + ');
  ctx.fillText(totalParts, sx + 110, y + 36);
  ctx.font = `13px ${FONT}`;

  // 第三列：涉及人数
  ctx.fillStyle = C.textLight;
  ctx.fillText('涉及', sx + 380, y + 16);
  ctx.fillStyle = C.text;
  ctx.font = `600 18px ${FONT}`;
  ctx.fillText(`${peopleSet.size} 人`, sx + 380, y + 36);

  y += summaryH + 16;

  // 明细标题
  ctx.fillStyle = C.primary;
  ctx.font = `600 16px ${FONT}`;
  ctx.fillText('账目明细', padding + 24, y);
  ctx.fillStyle = C.borderSoft;
  ctx.fillRect(padding + 24, y + 28, innerW - 48, 1);
  y += 40;

  sorted.forEach((e, idx) => {
    ctx.fillStyle = C.primary;
    ctx.font = `600 20px ${FONT}`;
    ctx.fillText(formatMoney(e.currency, e.amount), padding + 24, y);

    // 币种标签
    const moneyText = formatMoney(e.currency, e.amount);
    const moneyW = ctx.measureText(moneyText).width;
    ctx.font = `12px ${FONT}`;
    ctx.fillStyle = C.textLight;
    ctx.fillText(e.currency, padding + 24 + moneyW + 8, y + 6);

    // 日期
    ctx.font = `13px ${FONT}`;
    const dateW = ctx.measureText(e.date).width;
    ctx.fillText(e.date, padding + innerW - 24 - dateW, y + 6);
    y += 26;

    ctx.fillStyle = C.textLight;
    ctx.font = `13px ${FONT}`;
    ctx.fillText(`${e.paymentMethod}   ${e.payer} 付`, padding + 24, y);
    y += 22;

    ctx.fillStyle = C.textLight;
    ctx.fillText('参与:', padding + 24, y);
    const prefixW = ctx.measureText('参与: ').width;
    drawTags(ctx, e.participants, padding + 24 + prefixW, y - 2, C.primaryLight, C.primary);
    y += 24;

    if (e.note) {
      ctx.fillStyle = C.textLight;
      ctx.font = `13px ${FONT}`;
      ctx.fillText(`备注：${e.note}`, padding + 24, y);
      y += 20;
    }

    if (idx < sorted.length - 1) {
      ctx.fillStyle = C.borderSoft;
      ctx.fillRect(padding + 24, y + 4, innerW - 48, 1);
    }
    y += 12;
  });

  y += 16;

  // 平账结算
  ctx.fillStyle = C.primary;
  ctx.font = `600 16px ${FONT}`;
  ctx.fillText('平账结算', padding + 24, y);
  ctx.fillStyle = C.borderSoft;
  ctx.fillRect(padding + 24, y + 28, innerW - 48, 1);
  y += 40;

  currencies.forEach(cur => {
    const balance = balancesByCcy[cur];
    const names = Object.keys(balance).sort((a, b) => balance[b] - balance[a]);

    // 币种小标签
    roundRect(ctx, padding + 24, y, ctx.measureText(currencyLabel(cur)).width + 16, 24, 12);
    ctx.fillStyle = C.primaryLight;
    ctx.fill();
    ctx.fillStyle = C.primary;
    ctx.font = `600 13px ${FONT}`;
    ctx.fillText(currencyLabel(cur), padding + 32, y + 5);
    y += 34;

    names.forEach((name) => {
      const bal = balance[name];
      const settled = Math.abs(bal) < 0.005;
      roundRect(ctx, padding + 24, y, innerW - 48, 32, 8);
      ctx.fillStyle = settled ? '#f0f0f0' : '#f4faf7';
      ctx.fill();

      ctx.fillStyle = settled ? C.textLight : C.text;
      ctx.font = `14px ${FONT}`;
      const label = settled ? `${name} ✓` : name;
      ctx.fillText(label, padding + 40, y + 9);

      ctx.font = `600 14px ${FONT}`;
      if (settled) ctx.fillStyle = C.textLight;
      else if (bal < 0) ctx.fillStyle = C.danger;
      else ctx.fillStyle = C.primary;
      const sign = bal > 0 ? '+' : '';
      const amtText = `${sign}${formatMoney(cur, bal)}`;
      const amtW = ctx.measureText(amtText).width;
      ctx.fillText(amtText, padding + innerW - 40 - amtW, y + 9);

      y += 38;
    });

    const transfers = computeTransfers(balance);
    if (transfers.length > 0) {
      y += 4;
      ctx.fillStyle = C.textLight;
      ctx.font = `500 13px ${FONT}`;
      ctx.fillText('最少转账方案', padding + 24, y);
      y += 22;

      transfers.forEach(t => {
        roundRect(ctx, padding + 24, y, innerW - 48, 32, 6);
        const tg = ctx.createLinearGradient(padding + 24, y, padding + 24 + innerW - 48, y);
        tg.addColorStop(0, C.primaryLight);
        tg.addColorStop(1, '#ffffff');
        ctx.fillStyle = tg;
        ctx.fill();

        ctx.fillStyle = C.primary;
        ctx.fillRect(padding + 24, y, 3, 32);

        ctx.fillStyle = C.text;
        ctx.font = `600 14px ${FONT}`;
        ctx.fillText(t.from, padding + 36, y + 9);

        ctx.fillStyle = C.primary;
        ctx.font = `700 14px ${FONT}`;
        ctx.fillText('→', padding + 36 + ctx.measureText(t.from).width + 6, y + 9);

        ctx.fillStyle = C.text;
        ctx.font = `600 14px ${FONT}`;
        const fromW = ctx.measureText(t.from).width;
        ctx.fillText(t.to, padding + 36 + fromW + 24, y + 9);

        ctx.fillStyle = C.primary;
        ctx.font = `600 14px ${FONT}`;
        const amtText = formatMoney(cur, t.amount);
        const amtW = ctx.measureText(amtText).width;
        ctx.fillText(amtText, padding + innerW - 40 - amtW, y + 9);

        y += 36;
      });
    } else {
      y += 6;
      ctx.fillStyle = C.textLight;
      ctx.font = `13px ${FONT}`;
      ctx.fillText('已经结清，无需转账', padding + 24, y);
      y += 22;
    }

    y += 16;
  });

  y += 8;

  ctx.fillStyle = C.borderSoft;
  ctx.fillRect(padding + 24, y, innerW - 48, 1);
  y += 14;

  ctx.fillStyle = C.textLight;
  ctx.font = `12px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('— 由 记账小助手 生成 —', W / 2, y);
  ctx.textAlign = 'start';

  canvas.toBlob(blob => {
    if (!blob) throw new Error('canvas 转 blob 失败');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aa-bill-${new Date().toISOString().slice(0, 10)}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawTags(ctx, names, x, y, bgColor, fgColor) {
  const tagH = 20;
  const padX = 8;
  const gap = 6;
  const fontSize = 12;
  ctx.font = `${fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;

  let cx = x;
  let cy = y;
  const maxX = x + (760 - 28 * 2 - 48);

  names.forEach((name) => {
    const tw = ctx.measureText(name).width;
    const tagW = tw + padX * 2;

    if (cx + tagW > maxX) {
      cx = x;
      cy += tagH + 4;
    }

    roundRect(ctx, cx, cy, tagW, tagH, 10);
    ctx.fillStyle = bgColor;
    ctx.fill();

    ctx.fillStyle = fgColor;
    ctx.fillText(name, cx + padX, cy + 4);

    cx += tagW + gap;
  });
}

// ===== 清空 =====
document.getElementById('clearBtn').addEventListener('click', () => {
  if (state.entries.length === 0 && state.history.length === 0) {
    alert('当前没有数据');
    return;
  }
  if (confirm('确定清空所有账目和历史吗？此操作不可恢复，建议先导出备份。')) {
    state = { entries: [], history: [] };
    saveState();
    render();
  }
});

// ===== 启动 =====
loadState();
render();
</script>
